# GitHub turns off scheduled workflows in a public repository after 60 days
# without a commit. Re-enabling them through the API restarts that clock, so
# the 30-minute air data refresh in pages.yml keeps running on a quiet site.
name: Keep schedules on

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in pages.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
