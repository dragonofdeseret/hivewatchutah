# Publishes the site/ folder to GitHub Pages (hiveairutah.com) on every push
# to main, and with fresh air data from scripts/fetch_data.py on every other
# run. A cron-job.org job starts one every 30 minutes through workflow_dispatch
# (see "The 30-minute trigger" in README.md).
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    # A backup: GitHub ran this only every 4 to 7 hours in practice. It's off
    # the top of the hour, when GitHub most often delays scheduled runs.
    - cron: '20,50 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # Any feed that is down keeps its section of the last published air.json.
      # On any run but a push, with both DAQ and AirNow down the step fails,
      # so nothing is deployed and the previous site stays live. A push always
      # deploys.
      - name: Fetch air data
        run: |
          curl -fsSL --max-time 20 --retry 3 --retry-all-errors --retry-delay 5 \
            "${{ steps.pages.outputs.base_url }}/data/air.json" -o previous-air.json || rm -f previous-air.json
          strict=""
          if [ "${{ github.event_name }}" != "push" ]; then strict="--strict"; fi
          python3 scripts/fetch_data.py --previous previous-air.json $strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
